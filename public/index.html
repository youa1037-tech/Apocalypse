<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>새벽 다섯 시</title>
<style>
/* VOICE: 봉쇄된 밤의 생존 기록 — 건조하고 짧게, 1비트 흑백
   IDEA: 휴대용 게임기 화면 + 생존자 두 명의 상태판 — 내 수치는 숫자로, 상대는 '보이는 것'만
   PICTURE: 흑백 도트 장면이 화면 중심, 그 아래 생존자 카드 두 장
   COLOUR and TYPE: 검정 바탕, 흰 패널에 두꺼운 검은 안쪽 테두리, 선택은 반전 / Galmuri11 픽셀체
   LAYOUT: 위 구역·시계 → 장면 → 카드 두 장 → 글 상자+나침반 → 대화 → 도구 막대 */
@font-face{font-family:Galmuri;src:url(fonts/Galmuri11.woff2) format('woff2');font-weight:400}
@font-face{font-family:Galmuri;src:url(fonts/Galmuri11-Bold.woff2) format('woff2');font-weight:700}
/* 바탕(검정) 위 글자는 흰색, 패널 안에서는 변수를 검정으로 뒤집는다 */
:root{color-scheme:dark;--ink:#fff;--dim:#9a9a9a;--line:#fff;--paper:#000;--oct:polygon(7px 0,calc(100% - 7px) 0,100% 7px,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px),0 7px)}
.panel,.card,.tgroup,.sheet,.rbox,#mini,.tag,.li,.it,.rc,.mz,.chip,#hud,#feed,#prompt{--ink:#111;--dim:#555;--line:#111;--paper:#fff;color:var(--ink)}
#prompt.danger{--ink:#fff;--dim:#bbb;--line:#fff;--paper:#000}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{background:#000 repeating-conic-gradient(#000 0 25%,#161616 0 50%) 0 0/4px 4px;color:var(--ink);font:15px/1.5 Galmuri,ui-monospace,monospace;-webkit-font-smoothing:none;overflow-x:clip;touch-action:manipulation}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}
b{font-weight:700}
.dim{color:var(--dim)}
#app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom))}
.panel,.card,.tgroup{background:#fff;border:3px solid #fff;box-shadow:inset 0 0 0 3px #111;border-radius:12px}
:focus-visible{outline:3px dashed #fff;outline-offset:2px}
/* 팔각 타일 */
.tile{display:inline-flex;align-items:center;justify-content:center;flex:none;width:36px;height:36px;background:var(--line);clip-path:var(--oct);position:relative;color:var(--ink)}
.tile::before{content:'';position:absolute;inset:2px;background:var(--paper);clip-path:var(--oct)}
.tile>svg,.tile>span{position:relative}
.t-eye{width:28px;height:28px}
/* 버튼 */
.btn{background:#fff;color:#111;border:3px solid #111;border-radius:10px;padding:8px 12px;min-height:44px;cursor:pointer;box-shadow:0 3px 0 #111}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #111}
.btn.sm{min-height:38px;padding:5px 10px;font-size:14px}
.btn.inv{background:#111;color:#fff;box-shadow:0 3px 0 #555}
.btn.risk{background:repeating-linear-gradient(45deg,#fff 0 4px,#ccc 4px 8px)}
.btn:disabled,.btn.off{opacity:.4;cursor:default}
.row{display:flex;gap:8px;margin-top:8px}.row.wrap{flex-wrap:wrap}
.row .btn{flex:1 1 auto}
/* 로비 */
#lobby{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:16px 4px}
.logo{font-weight:700;font-size:44px;line-height:1.05;text-shadow:3px 0 #000,-3px 0 #000,0 3px #000,0 -3px #000,4px 4px 0 #444}
.logo small{display:block;font-size:15px;font-weight:400;color:#9a9a9a;margin-top:10px;text-shadow:none}
#lobby .panel{padding:16px}
#lobby .panel p{margin:0 0 8px}
#codeIn{width:100%;font-size:20px;text-transform:uppercase;padding:8px 10px;border:3px solid #111;border-radius:10px;background:#fff;color:#111}
.code{font-size:13px;word-break:break-all;background:#eee;padding:2px 4px}
/* 게임 */
#game{flex:1;display:flex;flex-direction:column;gap:8px}
#tabs{display:flex;gap:6px}
.tab{flex:1;background:#000;border:2px solid #555;border-radius:8px;padding:6px;font-size:13px;color:#9a9a9a;min-height:36px;cursor:pointer}
.tab.on{border-color:#fff;color:#fff}
.tab.dev{flex:0 0 auto}
.bang{background:#fff;color:#000;padding:0 5px;border-radius:4px;animation:blink .5s steps(2) infinite}
.top{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
#bHome{width:44px;height:44px;border-radius:10px;background:#fff;color:#111;border:3px solid #fff;box-shadow:inset 0 0 0 3px #111;cursor:pointer;display:flex;align-items:center;justify-content:center}
#ztitle{text-align:center}
.zn{font-weight:700;font-size:24px;line-height:1.05;text-shadow:2px 0 #000,-2px 0 #000,0 2px #000,0 -2px #000}
.ze{font-size:11px;color:#9a9a9a}
#clock{background:#fff;color:#111;border:3px solid #fff;box-shadow:inset 0 0 0 3px #111;border-radius:12px;padding:5px 10px;text-align:center;min-width:92px}
.tm{font-size:22px;font-weight:700;line-height:1.1}
.tm small{font-size:12px;font-weight:400}
.dl{font-size:11px;color:#444;white-space:nowrap}
.scenewrap{position:relative;aspect-ratio:192/120;background:#fff;border:3px solid #fff;box-shadow:inset 0 0 0 3px #111;border-radius:14px;padding:6px}
#scene{width:100%;height:100%;display:block;image-rendering:pixelated;border-radius:6px;background:#000}
#tags{position:absolute;inset:6px;pointer-events:none}
.tag{position:absolute;transform:translate(-50%,-100%);background:#fff;border:2px solid #000;font-size:12px;padding:0 5px;border-radius:5px;white-space:nowrap}
.tag.sm{font-size:11px}
#mini{position:absolute;top:12px;left:12px;width:54px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,8px);gap:2px;padding:4px;background:#fff;border:2px solid #000;border-radius:6px;cursor:pointer}
.mc{border:2px solid #000;border-radius:2px;display:block;background:#fff}
.mc.here{background:#000}
.mc.pt{background:repeating-linear-gradient(45deg,#000 0 2px,#fff 2px 4px)}
.mc.here.pt{background:#000;box-shadow:inset 0 0 0 1px #fff}
#pausebar{position:absolute;left:12px;right:12px;bottom:12px;background:#000;color:#fff;border:2px solid #fff;border-radius:8px;font-size:13px;padding:4px 8px;text-align:center}
/* 생존자 카드 */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{padding:10px 11px;display:flex;flex-direction:column;gap:7px}
.card.far{background:transparent;box-shadow:none;border:3px dashed #fff;--ink:#fff;--dim:#9a9a9a;--line:#fff;--paper:#000;color:#fff}
.ch{display:flex;gap:9px;align-items:center}
.av{width:38px;height:38px;flex:none;border:3px solid var(--line);border-radius:8px;background:var(--line);color:var(--paper);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px}
.cn{display:flex;flex-direction:column;line-height:1.25}
.cn b{font-size:17px}
.cs{font-size:12px;color:var(--dim)}
.cs.bad{color:var(--paper);background:var(--ink);padding:0 4px;border-radius:3px;width:fit-content}
.srow{display:flex;gap:7px;align-items:center}
.srow .tile{width:30px;height:30px}
.sbody{flex:1;display:flex;flex-direction:column;gap:2px}
.sl{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--dim)}
.sl b{color:var(--ink);font-size:14px}
.sl small{font-size:10px;color:var(--dim);font-weight:400}
.bar{display:block;height:9px;border:2px solid var(--line);border-radius:3px;background:var(--paper);overflow:hidden}
.bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--ink) 0 3px,var(--paper) 3px 4px)}
.b-hp i{background:var(--ink)}
.b-cold i{background:repeating-conic-gradient(var(--ink) 0 25%,var(--paper) 0 50%) 0 0/2px 2px}
.bar.sm{display:inline-block;width:60px;vertical-align:middle}
.chips{display:flex;flex-wrap:wrap;gap:3px}
.chips span{font-size:11px;border:2px solid var(--line);border-radius:4px;padding:0 3px;white-space:nowrap}
.obs{display:flex;flex-direction:column;gap:5px}
.orow{display:flex;gap:7px;align-items:center;font-size:13px}
.unseen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;font-size:12px;color:var(--dim);padding:8px 0}
/* 글 상자 + 나침반 */
#play{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start}
#play.wide{grid-template-columns:1fr}
#play.wide #compass{display:none}
#textbox{padding:12px 14px;min-height:148px}
#textbox p{margin:0 0 6px}
#textbox .look{font-size:14px}
#textbox .big{font-size:20px;font-weight:700}
#textbox.danger{background:#000;color:#fff;--ink:#fff;--dim:#bbb;box-shadow:inset 0 0 0 3px #fff;animation:pulse .6s steps(2) infinite}
.recent{list-style:none;margin:0;padding:0;font-size:14px}
.recent li{padding-left:12px;position:relative;margin-top:2px}
.recent li::before{content:'›';position:absolute;left:0}
.recent .k-radio{font-style:italic}
.recent .k-pa{color:#555}
.chip{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:2px solid #000;border-radius:8px;padding:4px 6px;margin:4px 0 8px;font-size:13px}
#compass{display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,42px);gap:3px}
.arm{background:#111;clip-path:var(--oct);border:0;padding:0;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;line-height:1.1;color:#111}
.arm::before{content:'';position:absolute;inset:3px;background:#fff;clip-path:var(--oct)}
.arm>span{position:relative}
.arm .ak{font-weight:700;font-size:10px;color:#555}
.arm .aw{display:none}
.arm.off::before{background:repeating-linear-gradient(45deg,#fff 0 3px,#bbb 3px 6px)}
.arm.off{cursor:default;color:#555}
.arm.glass{background:#fff;cursor:default;color:#fff}
.arm.glass::before{background:#000}
.arm.glass .ak{color:#bbb}
.arm.none{visibility:hidden}
.aN{grid-area:1/2}.aW{grid-area:2/1}.aE{grid-area:2/3}.aS{grid-area:3/2}
.hub{grid-area:2/2;display:flex;align-items:center;justify-content:center;color:#fff}
/* 대화 */
#chatdock{padding:8px 11px 11px}
#chatdock.new{box-shadow:inset 0 0 0 6px #111}
.cd-head{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
#chan{font-size:12px;font-weight:700;border:2px solid #000;border-radius:6px;padding:0 5px;white-space:nowrap}
#chan.c-radio{background:#000;color:#fff}
#chan.c-none{background:repeating-linear-gradient(45deg,#fff 0 3px,#ddd 3px 6px)}
#sigs{display:flex;gap:4px;flex-wrap:wrap}
.sig{background:#fff;color:#000;border:2px solid #000;border-radius:7px;font-size:12px;padding:2px 6px;min-height:30px;cursor:pointer}
.sig:disabled{opacity:.35;cursor:default}
#chatlines{list-style:none;margin:6px 0 0;padding:0;font-size:14px;min-height:22px}
#chatlines li{padding:1px 0;border-bottom:1px dotted #999;overflow-wrap:anywhere}
#chatlines li:last-child{border-bottom:0}
#chatlines .mine{color:#555}
#chatlines .k-radio{font-style:italic}
.say{display:flex;gap:6px;margin-top:6px}
.say input{flex:1;font-size:16px;border:3px solid #000;border-radius:10px;padding:8px;background:#fff;color:#000;min-height:44px}
.say input:disabled{background:#ddd}
/* 진행 중 작업 */
.taskbar{display:flex;align-items:center;gap:8px;padding:0 4px;min-height:34px;font-size:13px}
.taskbar .cap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50%}
.taskbar .bar{flex:1;border-color:#fff;background:#000}
.taskbar .bar i{background:repeating-linear-gradient(90deg,#fff 0 3px,#000 3px 4px)}
.taskbar .sec{white-space:nowrap;color:#9a9a9a}
/* 도구 막대 */
.toolbar{display:flex;gap:8px;margin-top:auto}
.tgroup{display:flex;gap:4px;padding:7px 8px}
.tgroup:first-child{flex:1;justify-content:space-between}
.tb{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:#111;min-width:44px}
.tb .tile{width:46px;height:46px}
.tb .tl{font-size:11px}
.tb.on .tile{background:#111;color:#fff}
.tb.on .tile::before{background:#111}
.tb.on .tl{background:#111;color:#fff;padding:0 4px;border-radius:3px}
.tb:active .tile{transform:translateY(1px)}
/* 시트 */
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{width:min(480px,100%);max-height:78dvh;display:flex;flex-direction:column;border-radius:16px 16px 0 0;padding:10px 12px max(12px,env(safe-area-inset-bottom))}
.shead{display:flex;justify-content:space-between;align-items:center;padding:2px 2px 8px;border-bottom:3px solid #000;margin-bottom:6px;font-size:17px}
#sheetBody{overflow-y:auto;flex:1;padding:2px}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:#fff;border:3px solid #000;border-radius:10px;padding:8px 10px;cursor:pointer;min-height:48px}
.li .dim{font-size:12px}
.sh{font-size:12px;font-weight:700;margin:10px 0 4px;padding:1px 6px;background:#000;color:#fff;display:inline-block;border-radius:4px}
.it{border:3px solid #000;border-radius:10px;margin-bottom:6px;overflow:hidden}
.it.open{box-shadow:0 0 0 2px #fff,0 0 0 4px #000}
.ih{display:grid;grid-template-columns:34px 1fr;grid-template-rows:auto auto;column-gap:8px;width:100%;background:#000;color:#fff;border:0;padding:6px 8px;text-align:left;cursor:pointer;min-height:48px;--ink:#fff;--line:#fff;--paper:#000}
.ih .tile{grid-row:1/3;align-self:center;font-weight:700}
.ih .nm{font-weight:700}
.ih .dim{color:#bbb;font-size:12px}
.acts{display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:#fff}
.empty{font-size:13px;padding:2px 4px 6px}
.chat,.log{list-style:none;margin:0;padding:0;font-size:14px}
.chat li{padding:2px 0;border-bottom:1px dotted #999}
.chat .k-radio{font-style:italic}
.log li{display:grid;grid-template-columns:44px 34px 1fr;gap:4px;padding:3px 0;border-bottom:1px dotted #aaa}
.log .lt{color:#555;font-size:12px}
.log .lk{font-size:11px;border:1px solid #000;border-radius:3px;text-align:center;height:fit-content}
.log .k-radio .lk,.log .k-pa .lk{background:#000;color:#fff}
.bigmap{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.mz{border:3px solid #000;border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:2px;font-size:13px}
.mz span{background:#000;color:#fff;border-radius:4px;padding:0 4px;width:fit-content}
.mz.here{background:repeating-linear-gradient(45deg,#fff 0 4px,#e5e5e5 4px 8px)}
.mz-roof,.mz-checkpoint{grid-column:1/3}
.mz-roof{grid-row:1}.mz-eaves{grid-row:2;grid-column:1}.mz-dorm{grid-row:2;grid-column:2}.mz-checkpoint{grid-row:3}.mz-market{grid-row:4;grid-column:1;border-style:dashed}.mz-pump{grid-row:4;grid-column:2;border-style:dashed}
.mk{font:inherit;font-size:11px;background:#fff;color:#111;border:2px dashed #111;border-radius:5px;padding:0 4px;margin-top:2px;cursor:pointer;text-align:left;width:fit-content}
.de{border-left:3px solid #111;padding:2px 0 2px 8px;margin:4px 0;font-size:13px}
.de i{font-style:normal;color:#555}
.dn{font-size:11px;font-weight:700;background:#111;color:#fff;padding:0 4px;border-radius:3px}
.run{border:2px solid #111;border-radius:8px;padding:4px 8px;margin:4px 0;font-size:13px}
.run summary{cursor:pointer;font-weight:700}
#diaryLine{width:100%;font-size:16px;border:3px solid #fff;border-radius:10px;padding:10px;background:#000;color:#fff;min-height:46px;margin-top:8px}
.rbox .li.sel{background:#111;color:#fff}
.ledger{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px}
.ledger>div{border:3px solid #111;border-radius:10px;padding:6px 8px;background:#fff;color:#111}
.ledger>div:first-child{border-style:dashed}
.ledger .lh{font-weight:700;margin-bottom:2px}
#prologue .ledger{margin:4px 0}
.ledchip{width:100%;justify-content:space-between;background:#fff;color:#111;cursor:pointer;text-align:left;font:inherit;font-size:13px}
.ft{font-size:12px;color:#333;padding-left:8px;border-left:2px dotted #999;margin:2px 0}
.feats{font-size:14px;margin:0 0 6px;color:#ddd}
@media (max-width:370px){.ledger{grid-template-columns:1fr}}
.rbox .li.sel .dim{color:#bbb}
/* 결과 */
#result{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:20;padding:12px}
.rbox{width:min(460px,100%);max-height:92dvh;overflow-y:auto;padding:16px}
.rt{font-size:24px;font-weight:700;margin-bottom:8px}
.rc{border:3px solid #000;border-radius:10px;padding:8px 10px;margin-bottom:8px}
.rn{font-weight:700;font-size:17px}
.ep{font-style:italic;margin-top:4px}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:#000;color:#fff;border:3px solid #fff;border-radius:10px;padding:8px 14px;z-index:30;font-size:14px;max-width:90vw}
/* 목표·안내 */
.goal{display:flex;align-items:center;gap:8px;width:100%;background:#111;color:#fff;border:0;border-radius:8px;padding:6px 9px;margin:0 0 8px;text-align:left;cursor:pointer;font-size:13px;min-height:36px}
.goal .gk{font-size:11px;font-weight:700;background:#fff;color:#111;padding:0 5px;border-radius:3px;flex:none}
.goal .gm{margin-left:auto;flex:none}
.hint{border:2px dashed #111;border-radius:8px;padding:6px 9px;margin:0 0 8px;font-size:13px}
.hint p{margin:0!important}
.hint .row{margin-top:6px}
.hint .btn{flex:0 1 auto}
#textbox.danger .goal,#textbox.danger .hint{display:none}
.gls{gap:4px}
.gl{display:flex;gap:10px;align-items:flex-start;border:3px solid #111;border-radius:10px;padding:7px 10px}
.gl .gx{font-weight:700;width:14px;flex:none}
.gl.done{background:repeating-linear-gradient(45deg,#fff 0 4px,#eee 4px 8px)}
.gl.done b{text-decoration:line-through}
.gl .dim{font-size:12px}
.howto{margin:0;padding-left:18px;font-size:13px;line-height:1.6}
/* ── 채팅 중심 화면 ─────────────────────────────── */
body.ingame #app{height:100dvh;min-height:0;overflow:hidden}
body.ingame #game{min-height:0;gap:6px}
.hdr{display:flex;align-items:center;gap:8px}
.hdr #bHome{width:36px;height:36px;flex:none}
#zname{margin:0;font-size:19px;line-height:1.1;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#clock{background:none;box-shadow:none;border:0;padding:0;min-width:0;color:#fff;text-align:right;display:flex;flex-direction:column;line-height:1.2}
#clock b{font-size:16px}
#clock span{font-size:11px;color:#9a9a9a;white-space:nowrap}
#hud{display:flex;align-items:center;gap:8px;width:100%;background:#fff;color:#111;border:3px solid #fff;box-shadow:inset 0 0 0 2px #111;border-radius:10px;padding:5px 9px;cursor:pointer;text-align:left;font:inherit;min-height:36px}
#hud .mine{display:flex;align-items:center;gap:6px;flex:none}
#hud .mini{display:flex;align-items:center;gap:2px}
#hud .mini .bar{width:26px;height:7px;border-width:1px}
#hud .bag{font-size:11px;border:1px solid #111;border-radius:3px;padding:0 3px}
#hud .al{font-size:11px;background:#111;color:#fff;border-radius:3px;padding:0 4px}
#hud .pl{flex:1;font-size:12px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud .pl.far{color:#666}
.scenewrap{height:clamp(92px,19vh,150px);aspect-ratio:auto;padding:0;border:3px solid #fff;box-shadow:none;border-radius:12px;overflow:hidden;background:#000;flex:none}
#scene{object-fit:cover;border-radius:0}
#tags{inset:0}
#mini{top:6px;left:6px}
body.danger .scenewrap{animation:pulseScene .5s steps(2) infinite}

#prompt .scb{text-align:left;white-space:normal;line-height:1.4}
#pane li.scn p{font-style:normal}
#pane li.cn2.scn p{border-left:2px solid #fff;padding-left:8px}
#pane li.scp p{opacity:.6;font-size:12px}
.story p{margin:0 0 4px}
.plog{margin:0 0 8px;border:1px solid #fff;padding:6px 8px}
.plog summary{cursor:pointer}
.plog ol{list-style:none;margin:6px 0 0;padding:0;max-height:40vh;overflow:auto;font-size:12px;line-height:1.5}
.plog time{opacity:.6;margin-right:4px}
/* 결산: 결말 문단 · 비밀 시트 */
.endp{border:1px solid #fff;padding:10px 12px;margin:0 0 10px;line-height:1.7}
.endp p{margin:0}
.endp .endo{margin-top:8px;opacity:.75;font-size:13px}
.endp .endo b{display:block;margin-bottom:2px}
.sec{margin:0 0 8px}
.sec .sn{font-weight:700;margin-bottom:4px}
.sec p{margin:0 0 3px;display:flex;gap:6px;line-height:1.5}
.sec p i{font-style:normal;flex:none}
.sec p.out{opacity:.6}
/* 소리 토글 · 반전 플래시 */
.tbar .snd{margin-left:8px;font:inherit;font-size:11px;background:#000;color:#fff;border:1px solid #fff;padding:0 6px;line-height:18px;cursor:pointer}
.tbar .snd[aria-pressed="false"]{opacity:.55}
html.flash body{filter:invert(1)}
.endp.solo{padding:22px 16px;font-size:16px;line-height:1.9;margin:18px 0}
#pane li.nc.rec{border-style:dashed}
.li.rt{flex-direction:column;align-items:flex-start;gap:2px;text-align:left}
.li.rt span{white-space:normal}
/* 연습 판 */
#coach{background:#fff;color:#111;border:3px solid #fff;box-shadow:inset 0 0 0 3px #111;border-radius:12px;padding:10px 12px;font-size:14px}
#coach p{margin:4px 0 0}
#coach .row{margin-top:8px}
.ch2{display:flex;gap:8px;align-items:center}
.cstep{font-size:11px;background:#111;color:#fff;padding:0 5px;border-radius:3px}
.cdo{font-weight:700;animation:blink 1s steps(2) infinite}
.coach-target{outline:3px dashed #fff!important;outline-offset:3px;animation:coachPulse .8s steps(2) infinite}
@keyframes coachPulse{50%{outline-color:transparent}}
body.tut .goal,body.tut .hint{display:none}
/* 프롤로그 */
#prologue{position:fixed;inset:0;z-index:25;background:#000;display:flex;justify-content:center;overflow-y:auto}
#prologueBody{width:min(480px,100%);min-height:100%;display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom))}
.ptabs{display:flex;gap:6px;margin-bottom:8px}
.pg{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;cursor:pointer;padding:16px 4px}
.pg.pick,.pg.wait{cursor:default}
.pg.title{align-items:center;text-align:center}
.pg.title canvas{width:100%;image-rendering:pixelated;border:3px solid #fff;border-radius:12px}
.pg h1{margin:8px 0 0;font-size:34px;line-height:1.1;text-shadow:3px 3px 0 #444}
.tapme{font-size:12px;color:#9a9a9a;animation:blink 1.2s steps(2) infinite}
.ptag{align-self:flex-start;font-size:12px;font-weight:700;background:#fff;color:#000;padding:1px 7px;border-radius:4px}
.pg.secret .ptag{background:#000;color:#fff;border:2px dashed #fff}
.pg.secret .pt{border-left:3px dashed #fff;padding-left:12px}
.pt{font-size:18px;line-height:1.75;margin:0}
.pt span{display:block}
.pg.pick .pt{font-size:15px;color:#ccc}
.pg.pick .list{--ink:#111}
.pg.pick .li{color:#111}
.pg.pick .li.sel{background:#111;color:#fff;border-color:#fff;box-shadow:0 0 0 2px #fff}
.pg.pick .li.sel .dim{color:#bbb}
#firstLine{width:100%;font-size:16px;border:3px solid #fff;border-radius:10px;padding:10px;background:#000;color:#fff;min-height:46px}
.go{margin-top:6px;width:100%;background:#fff!important;color:#000!important;min-height:52px;font-size:17px}
.pnav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:8px}
.pnav .btn{min-width:72px}
.pdots{display:flex;gap:5px}
.pdots i{width:7px;height:7px;border:2px solid #fff;display:block}
.pdots i.on{background:#fff}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{50%{box-shadow:inset 0 0 0 6px #fff}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:370px){.cards,#play{gap:6px}#compass{grid-template-columns:repeat(3,38px);grid-template-rows:repeat(3,38px)}.tb .tile{width:40px;height:40px}.card{padding:8px}.srow .tile{width:26px;height:26px}.zn{font-size:20px}}
</style>
</head>
<body>
<div id="app">
  <section id="lobby">
    <div class="logo">새벽 다섯 시<small>도쿄 봉쇄 · 2인 협동 생존 · 며칠이나 버틸까</small></div>
    <div class="panel" id="online">
      <p>방을 만들고 주소를 친구에게 보내세요.</p>
      <button class="btn inv" data-act="create" style="width:100%">방 만들기</button>
      <div class="row"><input id="codeIn" maxlength="5" placeholder="방 코드" autocomplete="off"><button class="btn" data-act="join">참가</button></div>
      <div id="rolePick" hidden></div>
    </div>
    <div class="panel">
      <p>처음이라면 혼자 5분 연습부터.</p>
      <button class="btn inv" data-act="tutorial" style="width:100%">처음이라면: 연습하기</button>
    </div>
    <div class="panel">
      <p>한 기기에서 렌·아케치 화면을 오가며 시험합니다.</p>
      <button class="btn" data-act="local" style="width:100%">혼자 시험하기</button>
      <p class="dim" id="localNote" hidden style="margin-top:8px">이 링크는 시험판입니다. 둘이 온라인으로 하려면 배포판을 쓰세요.</p>
    </div>
  </section>

  <section id="game" hidden>
    <nav id="tabs"></nav>
    <div id="band" aria-hidden="true" hidden><div id="bandText"></div></div>
    <div class="hdr2"><button id="bHome" data-act="home" aria-label="처음 화면으로"></button><button id="me" data-sheet="status" aria-label="내 상태 자세히"></button></div>
    <div id="coach" hidden></div>
    <section id="locPanel" class="box">
      <h2 class="tbar"><span id="locTitle"></span><span id="locClock"></span><button id="sndBtn" class="snd" type="button" data-act="sound" aria-pressed="true">소리</button></h2>
      <div class="scenewrap" id="scenewrap" data-act="sceneToggle" title="장면 크기 바꾸기"><canvas id="scene"></canvas><div id="tags"></div><div id="tachie"></div><div id="dlg" data-act="dlgNext" hidden></div><button id="mini" data-sheet="map" aria-label="지도 열기"></button><div id="pausebar" hidden></div><span id="sceneSize" aria-hidden="true"></span></div>
      <p id="locDesc"></p>
      <div id="goalbar"></div>
    </section>
    <div id="seg" role="tablist"></div>
    <ol id="pane" aria-live="polite"></ol>
    <div id="prompt" hidden></div>
    <div id="quick"></div>
    <div id="task" class="taskbar" hidden></div>
    <form id="sayForm" class="inputbar" autocomplete="off"><button type="button" id="chan" data-act="sigs"></button><input id="say" maxlength="140" autocomplete="off" enterkeyhint="send" placeholder="말하기"><button class="btn inv" id="sayBtn">보내기</button></form>
    <footer class="toolbar">
      <button id="bSearch" class="tb" data-act="search"></button>
      <button id="bAct" class="tb" data-sheet="act"></button>
      <button id="bBag" class="tb" data-sheet="bag"></button>
      <button id="bMap" class="tb" data-sheet="map"></button>
      <button id="bLog" class="tb" data-sheet="log"></button>
      <button id="bDev" class="tb" data-sheet="dev" hidden></button>
    </footer>
  </section>
  <div id="vote" hidden></div>

  <div id="sheet" hidden>
    <div class="sheet panel"><div class="shead"><b id="sheetTitle"></b><button class="btn sm" data-act="close">닫기</button></div><div id="sheetBody"></div><div id="sheetFoot"></div></div>
  </div>
  <div id="prologue" hidden><div id="prologueBody"></div></div>
  <div id="result" hidden><div class="panel rbox" id="resultBody"></div></div>
  <div id="toast" hidden></div>
</div>
<script type="module" src="js/client.js"></script>
</body>
</html>
